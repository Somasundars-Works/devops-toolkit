
name: Terraform plan and Apply
description: Initialize, validate, plan, and optionally apply a Terraform configuration directory

inputs:
  working_directory:
    description: Path to the Terraform root directory
    required: true

  terraform_version:
    description: Terraform CLI version
    required: false
    default: "1.14.6"

  apply:
    description: Whether to apply the Terraform plan after validation
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Verify Terraform directory
      shell: bash
      env:
        TF_DIR: ${{ inputs.working_directory }}
      run: |
        if [[ ! -d "$TF_DIR" ]]; then
          echo "::error::Directory not found: $TF_DIR"
          exit 1
        fi

        if ! find "$TF_DIR" -maxdepth 1 \
          -type f -name '*.tf' -print -quit | grep -q .; then
          echo "::error::No Terraform files found in $TF_DIR"
          exit 1
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Terraform Format Check
      uses: actions/terraform-validate@main
      with:
        working_directory: ${{ inputs.working_directory }}
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform plan -no-color -out=tfplan

    - name: Terraform Apply
      if: ${{ inputs.apply == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform apply -auto-approve -no-color tfplan